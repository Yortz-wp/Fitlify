
name: Build FITLIFY Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js icon.svg www/
          if [ -f README.txt ]; then cp README.txt www/; fi

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Fix Android system bars and insets
        run: |
          mkdir -p android/app/src/main/java/app/fitlify/mobile

          cat > android/app/src/main/java/app/fitlify/mobile/MainActivity.java <<'JAVA'
          package app.fitlify.mobile;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;

          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(11, 16, 23));
                  getWindow().setNavigationBarColor(Color.rgb(11, 16, 23));

                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                  WindowCompat.getInsetsController(
                      getWindow(),
                      getWindow().getDecorView()
                  ).setAppearanceLightStatusBars(false);

                  WindowCompat.getInsetsController(
                      getWindow(),
                      getWindow().getDecorView()
                  ).setAppearanceLightNavigationBars(false);

                  View content = findViewById(android.R.id.content);

                  ViewCompat.setOnApplyWindowInsetsListener(content, (view, windowInsets) -> {
                      Insets insets = windowInsets.getInsets(
                          WindowInsetsCompat.Type.systemBars()
                      );

                      view.setPadding(
                          insets.left,
                          insets.top,
                          insets.right,
                          insets.bottom
                      );

                      return windowInsets;
                  });

                  ViewCompat.requestApplyInsets(content);
              }
          }
          JAVA

      - name: Add Firebase configuration
        run: |
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase Google dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")
          s = p.read_text()

          if "rgcfaIncludeGoogle" not in s:
              s = s.replace(
                  "ext {",
                  "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'",
                  1
              )

          p.write_text(s)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")

          s = root.read_text()
          marker = "classpath 'com.google.gms:google-services:4.5.0'"

          pattern = r"classpath\s+['\"]com\.google\.gms:google-services:[^'\"]+['\"]"

          if re.search(pattern, s):
              s = re.sub(pattern, marker, s, count=1)
          else:
              pos = s.find("dependencies {")
              if pos == -1:
                  raise SystemExit("Root Gradle dependencies block not found")
              pos += len("dependencies {")
              s = s[:pos] + "\n        " + marker + s[pos:]

          root.write_text(s)

          s = app.read_text()
          marker = "apply plugin: 'com.google.gms.google-services'"

          if marker not in s:
              target = "apply plugin: 'com.android.application'"
              if target not in s:
                  raise SystemExit("Android application plugin not found")
              s = s.replace(target, target + "\n" + marker, 1)

          app.write_text(s)
          PY

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/fitlify-release.jks
          test -s android/app/fitlify-release.jks

      - name: Configure permanent signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          android = re.search(r'\bandroid\s*\{', s)
          if not android:
              raise SystemExit("Android configuration not found")

          signing = """
              signingConfigs {
                  fitlify {
                      storeFile file("fitlify-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          s = s[:android.end()] + signing + s[android.end():]

          build_types = re.search(r'\bbuildTypes\s*\{', s)
          if not build_types:
              raise SystemExit("Build types configuration not found")

          debug = """
                  debug {
                      signingConfig signingConfigs.fitlify
                  }
          """
          s = s[:build_types.end()] + debug + s[build_types.end():]
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FITLIFY-Android-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
